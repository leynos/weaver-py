[workspace]
members = [
    "crates/weaver-cli", "crates/weaver-runtime",
    "crates/weaverd",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
ortho_config = "0.5.0-beta2"
ortho_config_macros = "0.5.0-beta2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
nix = { version = "0.28", default-features = false, features = ["signal"] }
tokio = { version = "1.39", features = ["rt", "macros", "signal", "net", "time", "io-util", "sync"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rstest = "0.26"
rstest-bdd = "0.1.0-alpha4"
rstest-bdd-macros = "0.1.0-alpha4"
assert_cmd = "2.0"
tempfile = "3.10"
serial_test = "3.1"
weaver-runtime = { path = "crates/weaver-runtime" }
tracing = "0.1"
